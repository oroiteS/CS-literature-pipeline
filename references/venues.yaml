# =============================================================================
# 放行发表场所名单（会议和期刊）— Venue Whitelist
# 按用户给出的顺序扫描；名单由用户提供，不强制 CCF 等级。
# =============================================================================
# 本文件是「哪些会议放行」的唯一真源，由用户提供，bot 不自行编造。
#
# 【访谈问法】
#   「把放行的会议名单给我：A 会，以及你额外放行的 B 会。
#     每个会议可以带别名（简称/旧称/全称），便于匹配。」
#
# 【格式】只写名称也可：venues: [NeurIPS, "Nature Machine Intelligence"]
#   如需别名或单项设置，可用映射：
#   venues:
#     - name: 主名（用于日报展示，也是匹配主键）
#       aliases: [别名1, 别名2]      # 可选；arXiv 的 Comments 字段常用简称
#       score: 1.0                   # 可选；不写则用 default_score
#       note: 备注                    # 可选
#
# 【分数语义】
#   分数只影响排序，不影响放行与否。
#   放行与否只看「在不在本名单里」。
#   先按 relevance 降序，同分时按 venue_score 降序，再按时间由新到旧。
#   会议和期刊统一 default_score（可单项调整）；纯 preprint 用 preprint_score。
#
# 【匹配规则】
#   论文发表声明与本表 name / aliases 大小写不敏感、规范化后按完整词组匹配。
#   例：name 为 NeurIPS 且 aliases 含 NIPS，二者分别可命中；避免 ACL 误命中 NAACL。
#   未命中 → 淘汰。无法核验 → 按未命中处理并在报告中注明。
# =============================================================================

version: ""

# 放行会议的默认分数
default_score: 1.0

# 纯 preprint（无任何录用声明）的分数
preprint_score: 0.5

# 会议年份窗（与 profile.yaml 的 conference_years 同步；此处为兜底）
years: []

venues: []
