name: literature-pipeline
version: 1.0.0
description: >
  Declarative manifest for the literature search pipeline. SKILL.md keeps the
  search → gate → rank → deliver → archive workflow concise and loads the
  per-stage detail only when the run reaches that stage.

# 设计说明：管线阶段固定（检索 → 门槛 → 排序 → 交付 → 归档）。
# 各阶段的细则体量较大，按需加载，避免每次调用都灌进上下文。

always_load:
  - SKILL.md
  - references/profile.yaml
  - references/venues.yaml

references:
  on_demand:
    - condition: 判断综述/benchmark 是否淘汰、匹配会议别名、处理纯 preprint 分数
      path: references/venue-gate.md
    - condition: 核查论文是否开源、判断仓库是否为空壳
      path: references/opensource-gate.md
    - condition: 构造 arXiv 检索式、处理限速/406/429、降级到 websearch
      path: references/arxiv-channel.md
    - condition: arXiv 交付不足、需要从放行会议名单补足论文
      path: references/conference-channel.md
    - condition: 渲染交付给用户的日报卡片
      path: references/digest-format.md
    - condition: 读写 pushed.csv / seen.csv、处理 30 天滚动复核
      path: references/state-files.md
