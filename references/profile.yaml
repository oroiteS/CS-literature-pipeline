# =============================================================================
# 研究画像 — Research Profile
# =============================================================================
# 本文件由「配置访谈」生成，不由 bot 自行填写默认值。
#
# 【访谈清单】首次使用或缺项时，一次性问全，不要分多轮：
#
#   1. 关注方向
#      「你想跟踪什么研究方向？一句话描述，再给 3–8 个英文检索关键词。」
#      → 写入 direction.name / direction.description / direction.keywords
#
#   2. arXiv 类目
#      bot 根据方向「提议」类目，用户确认或修改。
#      例：LLM/个性化方向 → [cs.CL, cs.AI]；CV 方向 → [cs.CV]；
#          系统方向 → [cs.DC, cs.OS]；经济/计量 → [econ.EM, q-fin.*]
#      → 写入 arxiv_categories
#      ⚠️ 不要预设「用户一定是计算机方向」。类目必须由用户确认。
#
#   3. 会议年份窗
#      「会议论文收哪几年？」
#      → 写入 conference_years（如 [2025, 2026]）
#
#   4. 补充排除词（可选）
#      「有没有明确不想看到的词？」
#      → 写入 exclude
#
#   5. 时间窗 / 篇数（可选，不问则用默认）
#      → window_days / max_papers / min_relevance
#
# 【铁律】方向与名单只能由用户提供。缺项 → 拒绝运行并说明缺什么，
#        绝不编造默认方向或默认名单顶上跑一遍。
# =============================================================================

direction:
  # 一句话方向名（用于日报头部与相关度判断）
  name: ""
  # 一句话说明：关注什么问题、什么方法、什么场景
  description: ""
  # 英文检索关键词（arXiv 检索式据此构造；务必覆盖同义变体）
  keywords: []

# arXiv 类目限制（bot 提议，用户确认）
arxiv_categories: []

# 会议论文收哪几年（用户指定）
conference_years: []

# 额外排除词（可选）：命中标题/摘要即淘汰
exclude: []

# ---- 运行参数（有默认值，用户未指定时保持不变）----

# arXiv 时间窗（天）。7 = 近 7 天
window_days: 7

# 单次最多交付篇数
max_papers: 5

# 相关度下限（0–10）。低于此值不交付
min_relevance: 5

# 归档目录（相对本 skill 根目录）
data_dir: data
